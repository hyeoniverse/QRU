<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Noto+Sans+KR:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>나만의 디지털 명함 QRU</title>
		<meta
			name="description"
			content="QR 코드로 나를 소개하는 디지털 명함. 회원가입 없이 만들고, 링크와 QR 로 건네고, 랜덤 셔플로 새로운 사람을 만나보세요."
		/>

		<!--
			링크를 건네는 것이 이 서비스의 핵심이라 미리보기를 갖춘다.
			여기 적힌 내용은 명함 주소를 공유해도 똑같이 보인다. 명함에
			담긴 이름이 미리보기로 새어나가지 않으니 그대로 둔다.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="QRU" />
		<meta property="og:title" content="나만의 디지털 명함 QRU" />
		<meta
			property="og:description"
			content="QR 코드로 나를 소개하는 디지털 명함. 회원가입 없이 만들고 링크와 QR 로 건네보세요."
		/>
		<meta property="og:image" content="/logo-512.png" />
		<meta property="og:locale" content="ko_KR" />
		<meta name="twitter:card" content="summary" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
