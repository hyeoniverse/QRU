# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# 주의: firebase init hosting:github 을 다시 실행하면 이 파일이 덮어써진다.
# 아래 env 블록은 직접 추가한 것이므로 그때 다시 넣어야 한다.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        # .env 는 저장소에 없으므로 빌드 시점에 넣어준다.
        # Firebase 웹 설정은 번들에 실려 어차피 공개되는 값이라
        # secret 이 아니라 variable 로 둔다.
        # (Settings > Secrets and variables > Actions > Variables)
        # 비어 있으면 앱이 "Firebase 설정이 필요합니다" 안내를 표시한다.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QRYOU_APP }}
          channelId: live
          projectId: qryou-app
